name: CI

on:
  push:
    branches: [ main, "phase-*" ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ main ]

jobs:
  rust-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Ensure frontend dist exists for Tauri context
        shell: bash
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><html><head><title>EDM</title></head><body><div id="root"></div></body></html>' > apps/desktop/dist/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build extension for tests
        run: |
          cd extension
          npm install
          npm run build
      - name: Verify Architecture Invariants
        shell: powershell
        run: .\scripts\verify-invariants.ps1
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Tests
        run: cargo test --workspace

  frontend-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Desktop UI build & audit
        run: |
          cd apps/desktop
          npm install
          npm audit --omit=dev
          npm run build
      - name: Extension typecheck, build & audit
        run: |
          cd extension
          npm install
          npm audit
          npx tsc --noEmit
          npm run build
      - name: Node verification suites
        run: |
          node tests/v0_14_verification_suite.test.mjs
          node tests/v0_15_verification_suite.test.mjs
          node tests/progress.test.mjs

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [rust-check, frontend-check]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute Unified Release Build Script
        shell: powershell
        run: |
          .\scripts\build-release.ps1
      - name: Stage First-Party Binaries for SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          mkdir -p signpath-unsigned
          # Sign first-party EDM binaries only (never re-sign third-party DLLs like WebView2Loader.dll)
          for dir in target/release target/x86_64-pc-windows-msvc/release; do
            [ -f "$dir/EDM.exe" ] && cp "$dir/EDM.exe" signpath-unsigned/ || true
            [ -f "$dir/edm-nmh.exe" ] && cp "$dir/edm-nmh.exe" signpath-unsigned/ || true
            if [ -d "$dir/bundle/nsis" ]; then
              find "$dir/bundle/nsis" -maxdepth 1 -type f -name "EDM_*_x64-setup.exe" -exec cp {} signpath-unsigned/ \;
            fi
          done
      - name: Upload Unsigned First-Party Artifacts for SignPath
        id: upload-unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: edm-unsigned-binaries
          path: signpath-unsigned/
          if-no-files-found: error
      - name: Submit SignPath.org Signing Request
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'evo-download-manager'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'edm-windows-x64'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'signpath-signed'
      - name: Package Release
        shell: bash
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir -p release-dist
          if [ -d signpath-signed ] && ls signpath-signed/EDM_*_x64-setup.exe 1> /dev/null 2>&1; then
            cp signpath-signed/EDM_*_x64-setup.exe release-dist/
          else
            find target -type f -name "EDM_*_x64-setup.exe" -exec cp {} release-dist/ \;
          fi
          # Chromium store package for Chrome Web Store & Edge Add-ons
          if [ -f extension/dist/edm-extension-chromium.zip ]; then
            cp extension/dist/edm-extension-chromium.zip release-dist/
          fi
          # Sign Firefox add-on via web-ext if AMO keys are provided
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            echo "[CI] Signing Firefox unlisted XPI via web-ext..."
            npx web-ext sign --source-dir extension/dist/firefox --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --channel unlisted --artifacts-dir extension/dist/firefox-signed || echo "web-ext signing fallback to baseline xpi"
            if ls extension/dist/firefox-signed/*.xpi 1> /dev/null 2>&1; then
              cp extension/dist/firefox-signed/*.xpi release-dist/edm-firefox.xpi
            fi
          fi
          # Fallback to local built Firefox XPI if signing wasn't performed or failed
          if [ ! -f release-dist/edm-firefox.xpi ] && [ -f extension/dist/edm-firefox.xpi ]; then
            cp extension/dist/edm-firefox.xpi release-dist/
          fi
          tar -czvf release-dist/edm-extension.tar.gz -C extension/dist/chromium .
          (cd release-dist && sha256sum * > SHA256SUMS.txt)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edm-windows-x64
          path: release-dist/
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload ${{ github.ref_name }} release-dist/* --clobber || gh release create ${{ github.ref_name }} release-dist/* --title "EDM ${{ github.ref_name }}" --generate-notes --latest
          gh release edit ${{ github.ref_name }} --latest
